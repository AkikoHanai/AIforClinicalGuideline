<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GL作成ポータル</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login hidden">
  <h1>GL作成ポータル</h1>
  <p>がん薬物療法に伴う末梢神経障害診療ガイドライン2028年版</p>
  <button id="loginBtn" class="primary">ログイン</button>
  <p class="small">招待された委員だけがログインできます。招待メールの仮パスワードでログインしてください。</p>
</div>
<div id="app" class="app hidden">
  <nav class="side">
    <div class="brand">GL作成ポータル<span class="small">2028年版</span></div>
    <a href="#dashboard" data-page="dashboard">ダッシュボード</a>
    <div class="navsec" data-flow="sr"><div class="navh">SRの流れ(CQ)</div>
      <a href="#cq" data-page="cq">CQ・PICO・アウトカム</a>
      <a href="#papers" data-page="papers">論文(PDF登録・本文)</a>
      <a href="#f45" data-page="f45">様式4-5(個別研究の評価)</a>
      <a href="#sr8" data-page="sr8">様式SR-8(エビデンス総体)</a>
      <a href="#etd" data-page="etd">EtD・推奨(2023年版の体裁)</a>
      <a href="#screening" data-page="screening">スクリーニングの進捗</a></div>
    <div class="navsec" data-flow="soron"><div class="navh">総説の流れ(総論A〜N)</div>
      <a href="#soron" data-page="soron">総論の執筆・査読</a></div>
    <div class="navsec" data-flow="admin"><div class="navh">事務局</div>
      <a href="#users" data-page="users">利用者(ログイン)</a></div>
    <a href="#audit" data-page="audit">作成経過の記録</a>
    <div class="me"><span id="meName"></span><span id="meGroups" class="small"></span><button id="logoutBtn" class="link">ログアウト</button></div>
  </nav>
  <main id="main"></main>
</div>
<div id="toast" class="toast hidden"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
