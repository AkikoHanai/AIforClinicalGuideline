[project]
name = "etd-draft"
version = "0.1.0"
description = "既存診療ガイドラインから GRADE EtD ワークシート下書きを生成（出典検証付き）"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",
  "python-docx>=1.1",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
dev = ["pytest"]

[project.scripts]
etd-draft = "etd_draft.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["etd_draft*"]
